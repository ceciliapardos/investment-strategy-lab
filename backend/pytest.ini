[pytest]
pythonpath = .
testpaths = tests
markers =
    integration: llama a Yahoo Finance real (requiere internet; resultados no deterministas en precio, sí en estructura)
    e2e: requiere backend (puerto 8000) y frontend (puerto 5173) en ejecución
# Por defecto solo se ejecutan los tests deterministas (sin red).
#   Integración con Yahoo:  python -m pytest -m integration
#   App en marcha (e2e):    python -m pytest -m e2e
addopts = -m "not integration and not e2e" -p no:cacheprovider
